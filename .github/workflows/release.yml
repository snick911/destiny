# 打包流程：
#   - 每次推送到 main 或對 main 開 PR：建置跨平台 JAR／zip 與 Windows 免安裝版
#   - 推送到 main 且 AppInfo.VERSION 尚未發佈過：自動建立 v<版本> 標籤與 Release，
#     並附上兩個 zip（版本號未變則略過，不覆蓋已發佈的檔案）
name: 打包發佈

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 跨平台 JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 讀取版本號
        id: version
        run: |
          VERSION=$(sed -n 's/.*String VERSION = "\(.*\)";.*/\1/p' src/main/java/com/destiny/bazi/AppInfo.java)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: 編譯打包
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/destiny-bazi.jar
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/destiny-bazi-${{ steps.version.outputs.version }}.zip

  windows:
    name: Windows 免安裝版
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/input
      - name: jpackage（內含精簡 Java 執行環境）
        shell: bash
        run: |
          jpackage --type app-image \
            --input build/input \
            --main-jar destiny-bazi.jar \
            --main-class com.destiny.bazi.Main \
            --name DestinyBazi \
            --app-version "$VERSION" \
            --vendor snick911 \
            --description "Zi Ping Ba Zi calculator" \
            --add-modules java.desktop \
            --dest build/image
          cp README.md CHANGELOG.md build/image/DestinyBazi/
          test -f build/image/DestinyBazi/DestinyBazi.exe
      - name: 壓縮
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/image/DestinyBazi -DestinationPath "dist/destiny-bazi-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/destiny-bazi-${{ env.VERSION }}-windows-x64.zip

  release:
    name: 建立 Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 發佈 v${{ env.VERSION }}（已存在則略過）
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 已發佈過，略過；要發佈新版請先修改 AppInfo.VERSION"
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "子平八字排盤 $TAG" --notes-file notes.md assets/*.zip
